# Asyn-CIM explicit-mantissa bridge; 32 decode forwards after prefill.
model:
  name: qwen2.5-14b
  family: qwen2
  path: models/Qwen2.5-14B
  num_layers: 48
  attn_implementation: eager
quantization:
  enabled: true
  mode: quant_forward
  model_family: qwen2
  quantize_linear: true
  quantize_matmul: true
  scale_dir: quant/scales/qwen2_14b_asyn_cim_f8i4_256/
  calibration_policy:
    default: auto
  q_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  k_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  v_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  o_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  gate_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  up_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  down_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  qk_matmul:
    A_bit: e4m3
    B_bit: e4m3
    O_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  pv_matmul:
    A_bit: e4m3
    B_bit: e4m3
    O_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  lm_head:
    enabled: false
  mixed_precision: false
  dynamic_activation: false
  weight_scale_granularity: scalar
  shared_kv_gqa: true
  kv_cache:
    fp8_static: true
calibration:
  dataset: HuggingFaceFW/fineweb
  dataset_config: sample-10BT
  split: train
  streaming: true
  text_column: text
  min_text_tokens: 256
  num_samples: 64
  seq_length: 256
  batch_size: 1
  seed: 23
prefill_decode_profile:
  enabled: true
  prefill_length: 256
  decode_steps: 32
  dataset: HuggingFaceFW/fineweb
  dataset_config: sample-10BT
  split: train
  streaming: true
  text_column: text
  sample_offset: 0
  start_offset: 0
asyn_cim:
  height: 64
  width: 48
  banks: 16
  macros: 16
  frequency_hz: 1000000000.0
  cycles_per_effective_bit: 1
  bit_scope: mantissa
