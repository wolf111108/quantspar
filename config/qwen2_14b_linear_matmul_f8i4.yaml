model:
  name: qwen2.5-14b
  family: qwen2
  path: models/Qwen2.5-14B
  # The wrapper enumerates the checkpoint's actual layers.

  # MatMul 量化阶段必须用 eager。
  # 否则可能走 SDPA / FlashAttention，qk_matmul 和 pv_matmul patch 不一定生效。
  attn_implementation: eager

quantization:
  enabled: true
  mode: quant_forward
  model_family: qwen2

  quantize_linear: true
  quantize_matmul: true

  # Linear outliers are retained in the numerical forward.
  # Sparsity counts full-shape normal codes, including mask-generated zeros.
  # Recalibrate; do not copy INT8, strict-v2 or legacy outlier scales here.
  scale_dir: quant/scales/qwen2_14b_linear_matmul_f8i4_outlier_v3/
  mixed_precision: false
  calibration_policy:
    default: auto
    layer_policy:
      # Recalibrate Linear and MatMul scales for the actual configured formats.
      q_proj: recalibrate
      k_proj: recalibrate
      v_proj: recalibrate
      o_proj: recalibrate
      gate_proj: recalibrate
      up_proj: recalibrate
      down_proj: recalibrate

      qk_matmul: recalibrate
      pv_matmul: recalibrate

  per_layer_policy: {}

  q_proj:
    a_bit: "e4m3"
    w_bit: 4
    o_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0001
    p: 4

  k_proj:
    a_bit: "e4m3"
    w_bit: 4
    o_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0001
    p: 4

  v_proj:
    a_bit: "e4m3"
    w_bit: 4
    o_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0001
    p: 4

  o_proj:
    a_bit: "e4m3"
    w_bit: 4
    o_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0001
    p: 4

  gate_proj:
    a_bit: "e4m3"
    w_bit: 4
    o_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0001
    p: 4

  up_proj:
    a_bit: "e4m3"
    w_bit: 4
    o_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0001
    p: 4

  down_proj:
    a_bit: "e4m3"
    w_bit: 4
    o_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0001
    p: 4

  qk_matmul:
    A_bit: "e4m3"
    B_bit: "e4m3"
    O_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0
    p: 4

  pv_matmul:
    A_bit: "e4m3"
    B_bit: "e4m3"
    O_bit: "e4m3"
    d_bit: "e4m3"
    outlier_ratio: 0.0
    p: 4

  lm_head:
    enabled: false

calibration:
  dataset: HuggingFaceFW/fineweb
  dataset_config: sample-10BT
  split: train
  streaming: true
  text_column: text
  min_text_tokens: 4096

  # 第一轮先保持和 Linear-only 一样，便于对比。
  num_samples: 64
  seq_length: 8192
  batch_size: 1
  seed: 23

evaluation:
  seq_length: 8192
  max_eval_tokens: 32768
  min_doc_tokens: 4096
  datasets:
    - name: HuggingFaceFW/fineweb
      config: sample-10BT
      split: train
      streaming: true
      text_column: text
      max_eval_tokens: 65536
      min_doc_tokens: 4096

prefill_decode_profile:
  enabled: true

  # 初次测试建议先用 2048 + 64，确认没有问题后再加大
  prefill_length: 2048
  decode_steps: 64
  num_samples: 1

  # 如果不写，代码会自动取 prefill_length + decode_steps
  max_eval_tokens: 2112

  # FineWeb 一般是 streaming
  streaming: true
  text_column: text
  min_doc_tokens: 4096

unit_sparsity:
  enabled: false
  bit_group_size: 2   # a: 每个 unit 的 bit 数量
  dim_group_size: 2   # b: 每个 unit 的维度数量

generation:
  max_length: 100
  temperature: 1.0
  top_k: 50
  top_p: 0.95
  do_sample: true
  num_return_sequences: 1

logging:
  level: INFO
  log_dir: ./logs
  tensorboard: false
  wandb: false
  wandb_project: qwen-quantization

