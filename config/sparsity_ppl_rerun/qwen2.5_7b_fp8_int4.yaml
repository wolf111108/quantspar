# FineWeb rerun: FP explicit mantissa only; INT full two's complement.
# A x W labels refer to Linear; attention K/V uses A format, including mixed rows.
# Mask-created zeros are counted; protected sidepath codes are excluded.
# Recalibrate separately. The matrix runner assigns attempt-local scale/output paths.
model:
  name: qwen2.5-7b
  family: qwen2
  dtype: bf16
  attn_implementation: eager
quantization:
  enabled: true
  mode: quant_forward
  model_family: qwen2
  quantize_linear: true
  quantize_matmul: true
  mixed_precision: false
  scale_dir: quant/scales/sparsity_ppl_rerun/qwen2.5_7b_fp8_int4/
  calibration_policy:
    default: recalibrate
  q_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0001
    p: 4
  k_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0001
    p: 4
  v_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0001
    p: 4
  o_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0001
    p: 4
  gate_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0001
    p: 4
  up_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0001
    p: 4
  down_proj:
    a_bit: e4m3
    w_bit: 4
    o_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0001
    p: 4
  qk_matmul:
    A_bit: e4m3
    B_bit: e4m3
    O_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  pv_matmul:
    A_bit: e4m3
    B_bit: e4m3
    O_bit: e4m3
    d_bit: e4m3
    outlier_ratio: 0.0
    p: 4
  lm_head:
    enabled: false
calibration:
  dataset: HuggingFaceFW/fineweb
  dataset_config: sample-10BT
  split: train
  streaming: true
  text_column: text
  min_text_tokens: 4096
  num_samples: 64
  seq_length: 8192
  batch_size: 1
  seed: 23
evaluation:
  seq_length: 8192
  max_eval_tokens: 65536
  min_doc_tokens: 4096
  datasets:
  - alias: fineweb
    name: HuggingFaceFW/fineweb
    config: sample-10BT
    split: train
    streaming: true
    text_column: text
    seq_length: 8192
    max_eval_tokens: 65536
    min_doc_tokens: 4096
prefill_decode_profile:
  enabled: true
  prefill_length: 2048
  decode_steps: 64
  num_samples: 1
  max_eval_tokens: 2112
  streaming: true
  text_column: text
  min_doc_tokens: 4096
unit_sparsity:
  enabled: false
